name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'beta*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm-script: dist:win
            artifact-path: release/*.exe
            artifact-name: budget-ledger-windows
          - os: macos-latest
            npm-script: dist:mac
            artifact-path: release/*.dmg
            artifact-name: budget-ledger-macos
          - os: ubuntu-latest
            npm-script: dist:linux
            artifact-path: release/*.AppImage
            artifact-name: budget-ledger-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build installer
        run: npm run ${{ matrix.npm-script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: ls -R release-assets

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Budget Ledger ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
